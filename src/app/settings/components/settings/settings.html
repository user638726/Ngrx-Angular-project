@if(data$ | async;as data){
  @if(currentUser()){
    <div class="settings-page">
      <div class="container page">
        <div class="row">
          <div class="col-md-6 offset-md-3 col-xs-12">
            <h1 class="text-xa-center">Settings</h1>
            @if(data.backendErrors){
              <app-backend-error-messages [backendErrors]="data.backendErrors"></app-backend-error-messages>
            }
           <form [formGroup]="form" (ngSubmit)="submit()">
            <fieldset>
              <fieldset class="form-group">
                <input type="text" class="form-control from-control-lg" formControlName="image" placeholder="URL of profile picture"/>
              </fieldset>
               <fieldset class="form-group">
                <input type="text" class="form-control from-control-lg" formControlName="username" placeholder="Username"/>
              </fieldset>
              <fieldset class="form-group">
                <textarea type="text" class="form-control from-control-lg" formControlName="bio" placeholder="Short bio about you"></textarea>
              </fieldset>
              <fieldset class="form-group">
                <input type="text" class="form-control from-control-lg" formControlName="email" placeholder="Email"/>
              </fieldset>
              <fieldset class="form-group">
                <input type="password" class="form-control from-control-lg" formControlName="password" placeholder="New password"/>
              </fieldset>
              <button type="submit" class="btn btn-lg btn-primary pull-xs-right" [disabled]="form.invalid || data.isSubmitting">
                Update settings
              </button>
            </fieldset>
           </form>
           <hr/>
           <button class="btn btn-outline-danger" (click)="logout()">
            Or Click here to logout
           </button>
          </div>
        </div>
      </div>
    </div>
  }
}
