@if(data$ | async;as data){
  @if(data.isLoading){
    <app-loading></app-loading>
  }
  @if(data.error){
    <app-error-message [message]="data.error"></app-error-message>
  }
  @if(data.popularTags){
    <div class="sidebar">
      <p>Popular Tags</p>
      <div class="tag-list">
        @for(popularTag of data.popularTags;track popularTag){
          <a [routerLink]="['/tags',popularTag]" class="tag-default tag-pill">{{ popularTag }}</a>
        }
      </div>
    </div>

  }

}
